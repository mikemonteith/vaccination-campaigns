# Publishes GitHub Pages:
#
#   /              the released site, built from main
#   /admin/        the editor (Sveltia CMS)
#   /staging/      a preview of staging: accepted changes waiting for release
#   /data/<tag>/   the data files of every release, and /data/latest/
name: Deploy site

on:
  push:
    branches: [main, staging]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://${{ github.repository_owner }}.github.io
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find releases
        id: releases
        run: |
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName]' \
            > "$RUNNER_TEMP/versions.json"
          latest=$(jq -r '.[0] // empty' "$RUNNER_TEMP/versions.json")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/versions.json"

      - name: Build released site (main)
        env:
          BASE_URL: /${{ env.REPO_NAME }}/
          SITE_ENV: production
          VERSIONS_JSON: ${{ runner.temp }}/versions.json
          CHANGES_JSON: ${{ runner.temp }}/changes-main.json
          LATEST: ${{ steps.releases.outputs.latest }}
        run: |
          # Changes on main since the latest release (usually none).
          if [ -n "$LATEST" ]; then
            git worktree add "$RUNNER_TEMP/latest" "$LATEST"
            npm run -s diff -- --base "$RUNNER_TEMP/latest/data" \
              --title "Changes since $LATEST" --json "$CHANGES_JSON" > /dev/null
          fi
          DATA_VERSION="${LATEST:-unreleased}" npm run build:data -- --version "${LATEST:-unreleased}"
          DATA_VERSION="${LATEST:-unreleased}" npm run site:build

      - name: Build staging preview
        env:
          BASE_URL: /${{ env.REPO_NAME }}/staging/
          SITE_ENV: staging
          DATA_VERSION: unreleased (staging)
          CHANGES_JSON: ${{ runner.temp }}/changes-staging.json
        run: |
          if ! git ls-remote --exit-code --heads origin staging > /dev/null; then
            echo "::warning::No staging branch yet, so no staging preview"
            exit 0
          fi
          git fetch origin staging
          git worktree add "$RUNNER_TEMP/staging" origin/staging
          cd "$RUNNER_TEMP/staging"
          npm ci
          # Changes waiting for the next release: staging compared with main.
          npm run -s diff -- --base "$GITHUB_WORKSPACE/data" \
            --title "Changes waiting for the next release" --json "$CHANGES_JSON" > /dev/null
          npm run build:data -- --version "unreleased"
          npx docusaurus build site --out-dir "$GITHUB_WORKSPACE/build/staging"

      - name: Add release data files
        run: |
          for tag in $(jq -r '.[]' "$RUNNER_TEMP/versions.json"); do
            zips="$RUNNER_TEMP/zips/$tag"
            if gh release download "$tag" --pattern "campaign-data-$tag.zip" --dir "$zips"; then
              mkdir -p "build/data/$tag"
              unzip -q -o "$zips/campaign-data-$tag.zip" -d "build/data/$tag"
            else
              echo "::warning::No data files attached to release $tag"
            fi
          done
          latest=$(jq -r '.[0] // empty' "$RUNNER_TEMP/versions.json")
          if [ -n "$latest" ] && [ -d "build/data/$latest" ]; then
            cp -r "build/data/$latest" build/data/latest
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
