# Publishes GitHub Pages:
#
#   /              the site, built from main: every approved change
#   /admin/        the editor (Sveltia CMS)
#   /data/<tag>/   the data files of every release, and /data/latest/
#
# Main can hold approved changes that haven't been released yet. The site's
# Changes page lists them, and its version label says so.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://${{ github.repository_owner }}.github.io
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find releases
        id: releases
        run: |
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName]' \
            > "$RUNNER_TEMP/versions.json"
          latest=$(jq -r '.[0] // empty' "$RUNNER_TEMP/versions.json")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/versions.json"

      - name: Build site (main)
        env:
          BASE_URL: /${{ env.REPO_NAME }}/
          VERSIONS_JSON: ${{ runner.temp }}/versions.json
          CHANGES_JSON: ${{ runner.temp }}/changes-main.json
          LATEST: ${{ steps.releases.outputs.latest }}
        run: |
          # Approved changes on main since the latest release.
          version="unreleased"
          if [ -n "$LATEST" ]; then
            version="$LATEST"
            git worktree add "$RUNNER_TEMP/latest" "$LATEST"
            npm run -s diff -- --base "$RUNNER_TEMP/latest/data" \
              --title "Approved changes since $LATEST" --json "$CHANGES_JSON" > /dev/null
            if jq -e '.changes | length > 0' "$CHANGES_JSON" > /dev/null; then
              version="$LATEST plus approved changes"
            fi
          fi
          npm run build:data -- --version "$version"
          DATA_VERSION="$version" npm run site:build

      - name: Add release data files
        run: |
          for tag in $(jq -r '.[]' "$RUNNER_TEMP/versions.json"); do
            zips="$RUNNER_TEMP/zips/$tag"
            if gh release download "$tag" --pattern "campaign-data-$tag.zip" --dir "$zips"; then
              mkdir -p "build/data/$tag"
              unzip -q -o "$zips/campaign-data-$tag.zip" -d "build/data/$tag"
            else
              echo "::warning::No data files attached to release $tag"
            fi
          done
          latest=$(jq -r '.[0] // empty' "$RUNNER_TEMP/versions.json")
          if [ -n "$latest" ] && [ -d "build/data/$latest" ]; then
            cp -r "build/data/$latest" build/data/latest
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
