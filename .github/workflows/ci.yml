# Runs on every pull request into main, and on every push to an editor's
# branch (each save from the CMS). The push run is what checks an editor's
# change request, because GitHub doesn't run pull request workflows for a pull
# request that a workflow opened. The Editor branches workflow starts it by
# hand (workflow_dispatch) after it updates an editor's branch, for the same
# reason.
#
# On other pull requests, it also posts a plain-English summary of the data
# changes. Change requests have the summary in their description instead,
# kept up to date by the Change request workflow.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["edits/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Format
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: CMS config matches schemas
        run: npm run check:cms

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

  summary:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'edits/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Describe changes
        run: |
          npm run -s diff -- --base .base/data --title "Changes in this pull request" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- campaign-data-summary -->";
            const body = [marker, fs.readFileSync("summary.md", "utf8")].join("\n\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
